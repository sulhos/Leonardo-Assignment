# Machine-learning training configuration: splitting, baselines, and the neural
# network. See PROJECT_BRIEF.md §16-§18 and refinement addendum §1.2 (framework pin).

random_seed: 42

splitting:
  # Experiment A: in-domain, grouped split (default / core scope).
  experiment_a:
    train_fraction: 0.70
    val_fraction: 0.15
    test_fraction: 0.15
    group_by: scenario_family  # keep near-identical scenario variants in one split
  # Experiment B: unseen-weather-year holdout (stretch — requires >1 weather year).
  experiment_b:
    enabled: false
    holdout_weather_year: null
  # Experiment C: geographic transfer, Jinan -> Vasteras (optional stretch).
  experiment_c:
    enabled: false
    train_locations: [jinan]
    test_locations: [vasteras]

features:
  # No leakage: mechanistic optimal capacity / module count / cost must never appear
  # as inputs (PROJECT_BRIEF.md §15). Enforced in src/ai/features.py + tests.
  scaler: standard  # fit on training split only

baselines:
  naive:
    strategy: median_by_group  # placeholder strategy; finalized in Stage 5
  linear:
    model: ridge
    alpha_grid: [0.01, 0.1, 1.0, 10.0]
  tree:
    model: random_forest  # finalized in Stage 5: max_depth_grid's `null` (unlimited depth)
                           # is natively supported by RandomForestRegressor but not by
                           # GradientBoostingRegressor (which requires an int max_depth).
    n_estimators_grid: [100, 300]
    max_depth_grid: [3, 5, null]

neural_network:
  framework: keras  # pinned per refinement addendum §1.2 — do not mix frameworks in src/ai/
  architecture:
    hidden_layers: [128, 64, 32]
    activation: relu
    dropout_after_first_layer: 0.10
    output_activation: relu  # enforces non-negative capacity predictions
  training:
    loss: huber
    optimizer: adam
    learning_rate: 0.001
    batch_size: 32
    max_epochs: 500
    early_stopping:
      monitor: val_loss
      patience: 20
      restore_best_weights: true
    checkpoint:
      monitor: val_loss
      save_best_only: true
  reproducibility:
    fixed_seed: true
    note: >
      Full determinism is not guaranteed on GPU backends; document any
      run-to-run variance observed in Stage 6.

module_conversion:
  module_capacity_kwh: 15.36
  rounding: ceiling  # never round down (PROJECT_BRIEF.md §19)
