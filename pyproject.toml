[project]
name = "battery-sizing-ai-comparison"
version = "0.1.0"
description = "Comparison of neural-network and mechanistic models for battery sizing in an off-grid PV-wind energy system."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
