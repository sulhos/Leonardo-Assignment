[project]
name = "battery-sizing-mechanistic-vs-nn"
version = "2.0.0"
description = "V2: mechanistic (course-lecture equations) vs. neural network battery sizing, narrowed scope."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
