# Secondary site configuration: Vasteras, Sweden.
# NOT the project baseline. Kept available for geographic-transfer / sensitivity
# testing only (PROJECT_BRIEF.md §4, Experiment C in §16 — optional).
#
# Vasteras observes DST (Europe/Stockholm); the weather pipeline must handle the
# DST transition explicitly (PROJECT_BRIEF.md §7) — this is flagged here as a
# known complication to validate in Stage 2 / addendum §1.4, not yet resolved.

site:
  name: vasteras
  latitude: 59.61
  longitude: 16.54
  timezone: Europe/Stockholm
  elevation_m: 20  # approximate; verify against NASA POWER metadata in Stage 2

simulation:
  year: 2023
  expected_hourly_records: 8760  # non-leap local year; DST handling must be verified

system:
  # V2 Task 3: matches jinan.yaml's setting -- off-grid (no diesel) is the
  # sole V2 study configuration; see jinan.yaml for the full rationale.
  backup: none

load:
  target_annual_kwh: 30000
  max_hourly_kw: 15
  profile_family: residential_baseline
  random_seed: 42

pv:
  capacity_kwp: 20.0
  tilt_deg: 59.61       # latitude-tilt heuristic (site latitude) — see jinan.yaml comment
  azimuth_deg: 180.0
  system_losses_fraction: 0.14
  inverter_efficiency: 0.96

wind:
  rated_power_kw: 10.0
  hub_height_m: 15.0
  wind_shear_exponent: 0.14
  cut_in_mps: 2.5
  rated_mps: 11.0
  cut_out_mps: 25.0
  power_curve_speed_power_fraction:
    - [0.0, 0.0]
    - [2.5, 0.0]
    - [3.0, 0.0086]
    - [3.5, 0.0207]
    - [4.0, 0.0368]
    - [4.5, 0.0574]
    - [5.0, 0.0832]
    - [5.5, 0.1146]
    - [6.0, 0.1523]
    - [6.5, 0.1969]
    - [7.0, 0.2489]
    - [7.5, 0.3088]
    - [8.0, 0.3774]
    - [8.5, 0.455]
    - [9.0, 0.5423]
    - [9.5, 0.6399]
    - [10.0, 0.7484]
    - [10.5, 0.8682]
    - [11.0, 1.0]
    - [25.0, 1.0]
    - [25.01, 0.0]
    - [50.0, 0.0]
  # Confirmed via NASA POWER API validation (addendum §1.4, see data/README.md):
  # the hourly endpoint's WS10M parameter is used as the model input, at 10 m.
  weather_reference_height_m: 10

battery:
  chemistry: LFP
  module_capacity_kwh: 15.36
  module_rated_power_kw: 12.8
  round_trip_efficiency: 0.95
  min_soc_fraction: 0.10
  max_soc_fraction: 0.95
  initial_soc_fraction: 0.50
  self_discharge_rate_per_hour: 0.000034658
  economic_lifetime_years: 10
  project_lifetime_years: 20
  installed_cost_eur_per_kwh: 550
  cost_sensitivity_eur_per_kwh: [400, 550, 700]
  candidate_module_counts:
    min: 0
    max: 30
  temperature_derating:
    enabled: false
    charge_derating_threshold_c: null
    discharge_derating_threshold_c: null
    thermal_management_load_kw: null

reliability:
  primary_lpsp_target: 0.01
  sensitivity_targets_load_served: [0.990, 0.995, 0.999]

economics:
  real_discount_rate: 0.05

paths:
  raw_weather_dir: data/raw
  processed_weather_dir: data/processed
